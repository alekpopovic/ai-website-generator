[project]
name = "platform-workflows"
version = "0.0.0"
description = "Shared deterministic Temporal orchestration foundations"
requires-python = ">=3.12,<3.15"
dependencies = [
    "temporalio==1.30.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_workflows"]

[tool.uv]
package = true
