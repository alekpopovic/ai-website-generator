<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Northstar Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="/">Northstar Studio</a>
        <nav aria-label="Primary">
          <a href="/services/">Services</a><a href="/pricing/">Pricing</a><a href="/about/">About</a
          ><a href="/blog/">Journal</a><a href="/contact/">Contact</a>
        </nav>
      </div>
    </header>
    <main class="section">
      <div class="shell">
        <p class="eyebrow">Contact</p>
        <h1>Send a test message</h1>
        <p>This inert form has no submission endpoint and sends no data.</p>
        <form>
          <label>Name<input name="name" autocomplete="name" /></label
          ><label>Email<input name="email" type="email" autocomplete="email" /></label
          ><label>Message<textarea name="message" rows="6"></textarea></label
          ><button type="button">Preview message</button>
        </form>
      </div>
    </main>
    <footer class="site-footer">
      <div class="shell">The form is intentionally non-operational.</div>
    </footer>
  </body>
</html>
