default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, html, css, scss, json, yaml, markdown]
      - id: eslint
        name: ESLint
        entry: pnpm exec eslint --fix --no-warn-ignored
        language: system
        types_or: [javascript, jsx, ts, tsx, html, json, yaml, markdown]
      - id: detect-secrets
        name: Detect secrets
        entry: uv run detect-secrets-hook --no-verify --baseline .secrets.baseline
        language: system
        exclude: (^|/)(pnpm-lock\.yaml|uv\.lock)$
      - id: commitlint
        name: Conventional commit message
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
