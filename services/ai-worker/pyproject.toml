[project]
name = "platform-ai-worker"
version = "0.0.0"
description = "Private structured inference Temporal activity worker"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dspy==3.2.1",
    "platform-clients",
    "platform-schemas",
    "platform-workflows",
]

[project.scripts]
platform-ai-worker = "platform_ai_worker.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_ai_worker"]

[tool.uv]
package = true

[tool.uv.sources]
platform-clients = { workspace = true }
platform-schemas = { workspace = true }
platform-workflows = { workspace = true }
