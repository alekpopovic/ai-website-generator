[project]
name = "platform-browser-worker"
version = "0.0.0"
description = "Isolated Playwright Temporal activity worker"
requires-python = ">=3.12,<3.15"
dependencies = [
    "platform-api",
    "platform-clients",
    "platform-workflows",
    "playwright==1.61.0",
]

[project.scripts]
platform-browser-worker = "platform_browser_worker.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_browser_worker"]

[tool.uv]
package = true

[tool.uv.sources]
platform-api = { workspace = true }
platform-clients = { workspace = true }
platform-workflows = { workspace = true }
