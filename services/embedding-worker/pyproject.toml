[project]
name = "platform-embedding-worker"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
description = "Temporal worker for source-safe Ollama embeddings and Qdrant indexing"
dependencies = [
    "platform-api",
    "platform-clients",
    "platform-schemas",
    "platform-workflows",
]

[project.scripts]
platform-embedding-worker = "platform_embedding_worker.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_embedding_worker"]

[tool.uv]
package = true

[tool.uv.sources]
platform-api = { workspace = true }
platform-clients = { workspace = true }
platform-schemas = { workspace = true }
platform-workflows = { workspace = true }
