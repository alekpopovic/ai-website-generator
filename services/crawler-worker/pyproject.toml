[project]
name = "platform-crawler-worker"
version = "0.0.0"
description = "Isolated Scrapy Temporal activity worker"
requires-python = ">=3.12,<3.15"
dependencies = [
    "platform-api",
    "platform-clients",
    "platform-workflows",
    "scrapy==2.17.0",
]

[project.scripts]
platform-crawler-worker = "platform_crawler_worker.main:main"
platform-crawler-subprocess = "platform_crawler_worker.subprocess_main:main"
platform-crawler-fingerprint-backfill = "platform_crawler_worker.fingerprint_backfill:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_crawler_worker"]

[tool.uv]
package = true

[tool.uv.sources]
platform-api = { workspace = true }
platform-clients = { workspace = true }
platform-workflows = { workspace = true }
