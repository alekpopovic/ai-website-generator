[project]
name = "platform-workflow-worker"
version = "0.0.0"
description = "Temporal workflow orchestration worker"
requires-python = ">=3.12,<3.15"
dependencies = ["platform-api", "platform-workflows"]

[project.scripts]
platform-workflow-worker = "platform_workflow_worker.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_workflow_worker"]

[tool.uv]
package = true

[tool.uv.sources]
platform-api = { workspace = true }
platform-workflows = { workspace = true }
