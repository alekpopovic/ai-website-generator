[project]
name = "ai-website-generator"
version = "0.0.0"
description = "Development tooling for the AI website generation monorepo"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/python/*",
    "services/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "node_modules",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
exclude = '(?x)(^|/)(\.venv|node_modules|dist|build)/'

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["apps", "packages/python", "services", "tests"]
markers = [
    "integration: requires local integration dependencies",
    "e2e: exercises an end-to-end user journey",
]
