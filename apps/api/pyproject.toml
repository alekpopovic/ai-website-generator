[project]
name = "platform-api"
version = "0.0.0"
description = "FastAPI control plane for the AI website generation platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.2",
    "httpx2==2.7.0",
    "opentelemetry-api==1.44.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==26.1.0",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
platform-api = "platform_api.cli:main"
platform-seed-local-user = "platform_api.seed:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.uv]
package = true
